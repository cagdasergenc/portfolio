<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The site has no light mode; without this, native form controls and
         scrollbars still assume light and flash against the dark page. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0A0C" />
    <!-- No static title/description/og:title/og:description/og:url here on
         purpose. This root renders via createRoot (a client-only render
         into #root), not hydrateRoot -- React 19's title/meta dedup only
         works against tags it rendered itself in a previous pass, so a
         static tag baked into this file would sit alongside every route's
         <SEO>-rendered one forever, never replaced. Verified live: with a
         static <title> and <meta name="description"> both present, every
         route ended up with two of each in the DOM. Every route (Home,
         CaseStudy, NotFound) renders <SEO> unconditionally, so there's no
         real gap -- except for crawlers that don't execute JS, which will
         see nothing here instead of a wrong or duplicated value. That's
         the better failure mode of the two. -->
    <meta property="og:type" content="website" />
    <!-- No og:image yet -- needs a real asset. summary_large_image without
         one shows a broken/blank preview, worse than summary with none. -->
    <meta name="twitter:card" content="summary" />
    <!-- Switzer is the display face for every h1/h2/h3, including the Hero
         h1 that is almost always this page's LCP element. Preloading it
         (rather than waiting for the CSS @font-face to be discovered) trims
         one round-trip off first paint of that text. -->
    <link rel="preload" href="/src/fonts/Switzer-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Only the live portfolio contributes analytics. Route page views are
         sent by App; local development and deployment previews stay out. -->
    <script>
      if (['cagdasergenc.com', 'www.cagdasergenc.com'].includes(location.hostname)) {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        const campaign = {};
        const query = new URLSearchParams(location.search);
        // Keep attribution labels without forwarding the rest of the URL.
        // Campaign links use short lowercase slugs, never names or emails.
        for (const [parameter, field] of Object.entries({
          utm_source: 'campaign_source',
          utm_medium: 'campaign_medium',
          utm_campaign: 'campaign_name',
        })) {
          const value = query.get(parameter);
          if (value && /^[a-z][a-z0-9_-]{0,63}$/.test(value)) campaign[field] = value;
        }
        window.gtag('config', 'G-P1EHBYG8NY', {
          send_page_view: false,
          page_location: location.origin + location.pathname,
          ...campaign,
        });
        const analyticsScript = document.createElement('script');
        analyticsScript.async = true;
        analyticsScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-P1EHBYG8NY';
        document.head.appendChild(analyticsScript);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
